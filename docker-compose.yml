services:
  postgres:
    image: postgres:16-alpine
    container_name: mh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muslimhands}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muslimhands}
      POSTGRES_DB: ${POSTGRES_DB:-muslimhands}
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-muslimhands} -d ${POSTGRES_DB:-muslimhands}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mh-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-56379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
