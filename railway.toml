# Default Railway config (used by the API service when Config File Path is empty).
# For the web service, set Config-as-code path to: railway.web.toml

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.api.toml"
buildCommand = "pnpm install --frozen-lockfile && pnpm run build:api"

[deploy]
startCommand = "pnpm run start:api"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
