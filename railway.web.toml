# Railway config for the web (Next.js) service.
# In Railway: Settings → Config-as-code → set path to railway.web.toml

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.web.toml"
buildCommand = "pnpm install --frozen-lockfile && pnpm run build:web"

[deploy]
startCommand = "pnpm run start:web"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
