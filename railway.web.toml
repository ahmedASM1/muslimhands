# Railway config for the web (Next.js) service.
# In Railway → web → Settings → Config-as-code → Config File Path:
#   railway.web.toml
#
# Also set variable:
#   NEXT_PUBLIC_API_URL=https://<your-api-domain>/api/v1

[build]
builder = "NIXPACKS"
nixpacksConfigPath = "nixpacks.web.toml"
buildCommand = "pnpm install --frozen-lockfile && pnpm run build:web"

[deploy]
startCommand = "node apps/web/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
