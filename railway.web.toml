# Railway config for the web (Next.js) service.
# In Railway → web → Settings:
#   - Builder: Dockerfile
#   - Dockerfile path: Dockerfile.web
# Or set Config File Path to railway.web.toml if still available.
#
# Required variable (build-time):
#   NEXT_PUBLIC_API_URL=https://<your-api-domain>/api/v1

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
